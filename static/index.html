<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Live Chat — Private</title>
  <meta name="description" content="Clean private mobile chat application.">
  <link rel="stylesheet" href="style.css?v=4.9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mobile Chat Application UI -->
  <div class="chat-app" id="chatApp">
    
    <!-- Subtle curved watermark vector background -->
    <div class="background-watermark" aria-hidden="true">
      <svg viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-50 150 C 150 120, 300 350, 450 300" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 4"/>
        <path d="M-80 400 C 100 480, 250 380, 480 620" stroke="#CBD5E1" stroke-width="1.2"/>
        <path d="M-20 700 C 180 620, 220 780, 450 740" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 3"/>
        <path d="M120 -50 C 200 200, 50 450, 220 850" stroke="#E2E8F0" stroke-width="1"/>
      </svg>
    </div>

    <!-- Chat Header Navigation with Live Opponent Typing Status -->
    <header class="chat-header" aria-label="Conversation Header">
      <div class="header-left">
        <!-- Avatar with Free API source (Click to close keyboard / get new random avatar) -->
        <div class="avatar-wrapper" id="avatarWrapper" title="Click to close keyboard">
          <img id="avatarImg" class="avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=256" alt="Anonymous Avatar">
          <span class="avatar-badge" aria-label="Online"></span>
        </div>

        <!-- Contact Info (Shows live typing status when opponent types) -->
        <div class="user-info">
          <h1 class="user-name" id="userName">Anonymous</h1>
          <span class="user-status" id="userStatus">Online</span>
        </div>
      </div>

      <!-- Header Actions: Sound, Clear Chat & Lock App -->
      <div class="header-actions">
        <!-- Tiny Unfocused External Link to LiveDraw -->
        <a href="https://livedrawing.onrender.com/" target="_blank" rel="noopener noreferrer" class="tiny-external-btn" id="liveDrawingBtn" aria-label="Open LiveDraw" title="LiveDraw">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </a>
        <button class="action-icon-btn" id="soundToggleBtn" aria-label="Toggle opponent typing sound" title="Opponent typing sound enabled (Click to mute)">
          <!-- Sound ON Icon -->
          <svg class="sound-on-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <!-- Sound OFF Icon -->
          <svg class="sound-off-icon" style="display: none;" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <button class="action-icon-btn" id="clearChatBtn" aria-label="Clear Chat History" title="Clear Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button class="action-icon-btn" id="lockAppBtn" aria-label="Lock App / Switch User" title="Lock App">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Scroll Container -->
    <main class="chat-body" id="chatMessages" role="log" aria-live="polite">
      
      <!-- Date Badge -->
      <div class="date-divider" id="chatDateDivider">Today</div>

      <!-- Live Typing Indicator for Opponent User -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>

    </main>

    <!-- Bottom Input Area (Keyboard-aware, Image only - no generic attachments) -->
    <footer class="chat-footer" id="chatFooter">
      <div class="input-container">
        
        <!-- Input Pill -->
        <div class="input-pill" id="inputPill">
          <div class="input-normal-content" id="inputNormalContent">
            <!-- Emoji Picker Trigger -->
            <button class="input-icon-btn" id="emojiBtn" aria-label="Insert Emoji" type="button">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </button>

            <!-- Input Text Field -->
            <input type="text" id="chatInput" class="chat-input" placeholder="Enter Text" autocomplete="off" enterkeyhint="send">
            <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
          </div>

          <!-- Live Recording State Inside Pill -->
          <div class="input-recording-content" id="inputRecordingContent" style="display: none;">
            <div class="recording-badge">
              <span class="recording-pulse-dot"></span>
              <span class="recording-timer" id="recordingTimer">0:00</span>
            </div>
            <div class="recording-live-waveform">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="cancel-record-btn" id="cancelRecordBtn" type="button" aria-label="Cancel Voice Recording" title="Cancel">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Action Button (Mic by default, Send when typing) -->
        <button class="send-btn mic-mode" id="actionBtn" aria-label="Record voice message" type="button" title="Record Voice">
          <span id="actionIcon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </span>
        </button>

      </div>
    </footer>

    <!-- Floating Balloon Emoji Reactions Overlay -->
    <div class="floating-balloons-container" id="floatingBalloonsContainer"></div>

    <!-- Emoji Popover -->
    <div class="emoji-popover" id="emojiPopover">
      <div class="emoji-popover-actions">
        <button class="emoji-popover-action-btn" id="emojiImageBtn" type="button" title="Send Photo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Send Photo</span>
        </button>
      </div>
      <div class="emoji-grid">
        <button class="emoji-btn">👍</button>
        <button class="emoji-btn">💖</button>
        <button class="emoji-btn">❤️</button>
        <button class="emoji-btn">💋</button>
        <button class="emoji-btn">💗</button>
        <button class="emoji-btn">😭</button>
        <button class="emoji-btn">🫦</button>
        <button class="emoji-btn">😂</button>
        <button class="emoji-btn">🌚</button>
        <button class="emoji-btn">🥵</button>
        <button class="emoji-btn">👀</button>
        <button class="emoji-btn">🫂</button>
      </div>
    </div>

    <!-- Private PIN Input Pad Overlay -->
    <div class="pin-overlay" id="pinOverlay">
      <div class="pin-card">
        <div class="pin-header">
          <div class="pin-lock-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2 class="pin-title">Enter Passcode</h2>
          <p class="pin-subtitle">Enter your secret 4-digit PIN</p>
        </div>

        <!-- 4 PIN Dots Indicator -->
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <div class="pin-feedback" id="pinFeedback"></div>

        <!-- Numeric Keypad -->
        <div class="pin-keypad">
          <button type="button" class="pin-key" data-digit="1">1</button>
          <button type="button" class="pin-key" data-digit="2">2</button>
          <button type="button" class="pin-key" data-digit="3">3</button>
          <button type="button" class="pin-key" data-digit="4">4</button>
          <button type="button" class="pin-key" data-digit="5">5</button>
          <button type="button" class="pin-key" data-digit="6">6</button>
          <button type="button" class="pin-key" data-digit="7">7</button>
          <button type="button" class="pin-key" data-digit="8">8</button>
          <button type="button" class="pin-key" data-digit="9">9</button>
          <div class="pin-key-empty"></div>
          <button type="button" class="pin-key" data-digit="0">0</button>
          <button type="button" class="pin-key pin-back-key" id="pinBackspaceBtn" aria-label="Delete">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Image Fullscreen Lightbox Modal -->
  <div class="image-lightbox" id="imageLightbox" style="display: none;" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <button class="lightbox-close-btn" id="lightboxCloseBtn" type="button" aria-label="Close image preview">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lightbox-content">
      <img id="lightboxImage" class="lightbox-img" src="" alt="Fullscreen Image Preview">
    </div>
  </div>

  <script src="app.js?v=5.1"></script>
</body>
</html>
